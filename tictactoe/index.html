<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			body {
				display: grid;
				place-content: center;
			}
			#board {
				display: grid;
				gap: 16px;
				place-content: center;
				grid-template-columns: repeat(3, 1fr);
				grid-gap: 1rem;
				overflow: hidden;
				width: 416px;
				padding: 16px;
				background-color: #14bdac;
			}

			#board > button {
				height: 50px;
				border: none;
				height: 8rem;
				display: grid;
				aspect-ratio: 1;
				font-size: 2.5rem;
				font-family: Arial;
				position: relative;
				place-content: center;
				background-color: #14bdac;
			}
			#board > button:not(:nth-child(3n)):before {
				position: absolute;
				content: "";
				height: calc(100% + 1rem);
				width: 4px;
				top: -10px;
				right: -10px;
				background-color: #000;
			}
			#board > button:not(:nth-last-child(-n + 3)):after {
				position: absolute;
				content: "";
				height: 4px;
				width: calc(100% + 1rem);
				bottom: -10px;
				left: -10px;
				background-color: #000;
			}
		</style>
	</head>
	<body>
		<h1>Tic Tac Toe</h1>
		<h3 id="game-decs">Its <span id="player-turn"></span> turn</h3>
		<section id="board"></section>
		<script src="./dist/tictactoe.js"></script>
	</body>
</html>
